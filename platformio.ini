; PlatformIO Project Configuration File
; Build-time configuration comes from config.env via extra script

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
monitor_port = /dev/ttyUSB1
upload_port = /dev/ttyUSB1
;/dev/ttyUSB0
monitor_speed = 57600
;upload_protocol = espota
;upload_flags =
;    --port=3232
;    --auth=admin
;upload_port = 192.168.178.83
framework = arduino
extra_scripts = extra_scripts/read_config_env.py

build_src_filter =
	+<nixiDriver.cpp>
	+<hardware/master_no_rtc.cpp>
	+<hardware/rtc_local.cpp>
	+<hardware/hardware_profile_guard.cpp>

lib_deps =
	johnnyb/Shifty@^0.1.5
	bblanchon/ArduinoJson@^6.16.1
	adafruit/RTClib@^1.11.4


