; PlatformIO Project Configuration File
; Build-time configuration comes from config.env via extra script

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
;/dev/ttyUSB0
monitor_speed = 115200
; Custom PCB has no auto-reset circuit (no DTR/RTS → BOOT/EN wiring).
; --before no_reset tells esptool to skip the auto-reset handshake and
; connect to whatever mode the chip is already in.
; The user must manually hold BOOT, press+release RST, then release BOOT
; before running the upload command.
upload_flags =
    --before
    no_reset
    --after
    hard_reset
;upload_protocol = espota
;upload_flags_ota =
;    --port=3232
;    --auth=admin
;upload_port_ota = 192.168.178.83
framework = arduino
extra_scripts = pre:extra_scripts/read_config_env.py

build_src_filter =
	+<nixiDriver.cpp>
	+<hardware/clock_provisioning.cpp>
	+<hardware/master_no_rtc.cpp>
	+<hardware/rtc_local.cpp>
	+<hardware/hardware_profile_guard.cpp>

lib_deps =
	johnnyb/Shifty@^0.1.5
	bblanchon/ArduinoJson@^6.16.1
	adafruit/RTClib@^1.11.4


